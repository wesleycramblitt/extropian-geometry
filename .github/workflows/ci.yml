name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-default:
    name: build + test (default, no OCCT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libfreetype-dev libharfbuzz-dev fonts-dejavu-core
      - name: Configure
        run: cmake -S . -B build -G Ninja -DBUILD_TESTS=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - name: Build
        run: cmake --build build -j "$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure
